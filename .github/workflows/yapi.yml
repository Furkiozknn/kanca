name: Yapi

# Oynanabilir bir derleme uretir ve CI artifact'i olarak birakir.
#
# Iki tetikleyici var, ikisi de bir insan karari:
#   - Elle (workflow_dispatch). Varsayilan davranisi HICBIR SEY
#     YAYIMLAMAMAKTIR: amaci, oyunu oynayip dogrulamak isteyen kisinin
#     Godot kurmadan bir paket indirebilmesi -- yayin karari oynandiktan
#     sonra verilir.
#   - Bir GitHub Release YAYIMLANDIGINDA. Ayni iki paket o surumun
#     etiketindeki koddan uretilir ve surum sayfasina zip olarak eklenir;
#     boylece oyuncu, depoya yazma yetkisi ya da GitHub hesabi olmadan
#     oyunu indirebilir. Release'i yayimlamak zaten elle yapilan bir is.
#
# Her iki yolda da web paketi once tarayicida DUMAN TESTINDEN geciyor
# (tools/web_duman.py): motor aciliyor mu, menu tiklamaya cevap verip
# 1. bolumu yukluyor mu, oyuncu hareket ediyor mu. Dusen paket ne
# artifact'e ne Pages'e ne de surum sayfasina gider.
#
# Oynadiktan sonra yayinlamak icin: Run workflow penceresinde
# "sayfaya_yayinla" kutusunu isaretle. O zaman ayni web paketi GitHub
# Pages'e gider ve oyun tarayicidan oynanabilir olur. Kutu
# isaretlenmedikce Pages'e dokunulmaz.
#
# Paket boyutlari adimda yazdiriliyor; disa aktarma suzgecinin oyuncuya
# inen pakete ne koydugu boylece olculuyor, tahmin edilmiyor.

on:
  workflow_dispatch:
    inputs:
      sayfaya_yayinla:
        description: "Web paketini GitHub Pages'e yayinla (varsayilan: yalniz artifact)"
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: yapi-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI testleriyle ayni sabit surum. "latest", motor guncellenince
  # depodan bagimsiz bir kirmizi uretirdi.
  GODOT_SURUM: 4.7.2-stable
  GODOT_SABLON: 4.7.2.stable

jobs:
  yapi:
    name: Windows + Web disa aktar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Varliklar Git LFS'te; cekilmezse sahneler "bozuk kaynak" duser.
          lfs: true

      - name: Godot ve disa aktarma sablonlari
        run: |
          set -euo pipefail
          ad="Godot_v${GODOT_SURUM}_linux.x86_64"
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_SURUM}/${ad}.zip"
          unzip -q godot.zip
          chmod +x "$ad"
          sudo mv "$ad" /usr/local/bin/godot
          curl -fsSL -o sablon.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_SURUM}/Godot_v${GODOT_SURUM}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_SABLON}"
          unzip -q sablon.tpz -d sablon
          mv sablon/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_SABLON}/"
          godot --version

      # Ice aktarma ayri adim: taze checkout'ta .godot yok ve eksik
      # onbellek, disa aktarmayi ilgisiz hatalarla dusuruyor.
      - name: Projeyi ice aktar
        run: godot --headless --path . --import

      - name: Disa aktar
        run: |
          set -euo pipefail
          mkdir -p build/windows build/web
          godot --headless --path . --export-release "Windows Masaustu" "build/windows/kanca.exe"
          godot --headless --path . --export-release "Web (HTML5)" "build/web/index.html"

      - name: Paket boyutlari
        run: |
          set -euo pipefail
          echo "--- web ---"
          ls -l build/web
          if [ -f build/web/index.pck ]; then
            echo "web pck: $(stat -c%s build/web/index.pck) bayt"
          fi
          echo "--- windows ---"
          ls -l build/windows
          du -sh build/web build/windows

      # Disa aktarma "basarili" bitip tarayicida acilmayan bir paket
      # uretebilir. Yayindan once gercek bir Chromium'da aciliyor.
      - name: Web paketi tarayicida aciliyor mu (duman testi)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/duman"
          "$RUNNER_TEMP/duman/bin/pip" install --quiet playwright==1.63.0
          "$RUNNER_TEMP/duman/bin/python" -m playwright install --with-deps chromium
          "$RUNNER_TEMP/duman/bin/python" tools/web_duman.py build/web

      - uses: actions/upload-artifact@v6
        with:
          name: kanca-web
          path: build/web
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: kanca-windows
          path: build/windows
          if-no-files-found: error

  sayfa:
    name: GitHub Pages'e yayinla
    needs: yapi
    # Kutu isaretlenmedikce bu is hic kosmaz; varsayilan yayimlamamaktir.
    if: ${{ inputs.sayfaya_yayinla }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: kanca-web
          path: web

      # Pages depoda BIR KEZ elle acilmali: Settings -> Pages -> Source:
      # "GitHub Actions". `enablement: true` bunu yapamiyor -- is akisinin
      # GITHUB_TOKEN'i Pages sitesi olusturamaz ve adim "Resource not
      # accessible by integration" ile duser (ayni is akisi tek-tus-kosu'da
      # 25 Eylul 2026'da tam burada dustu). Bir kez acildiktan sonra bu adim
      # yalnizca dogrular.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: dagit
        uses: actions/deploy-pages@v4

  surum:
    name: Paketleri surum sayfasina ekle
    needs: yapi
    # Yalnizca bir Release yayimlandiginda; elle tetiklemede hic kosmaz.
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Surum varligi yuklemek icin gereken tek yetki; baska is bunu almiyor.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ETIKET: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: paket

      - name: Ziple ve surume yukle
        run: |
          set -euo pipefail
          (cd paket/kanca-web && zip -q -r "$GITHUB_WORKSPACE/kanca-${ETIKET}-web.zip" .)
          (cd paket/kanca-windows && zip -q -r "$GITHUB_WORKSPACE/kanca-${ETIKET}-windows.zip" .)
          ls -l kanca-*.zip
          gh release upload "$ETIKET" kanca-*.zip --clobber --repo "$GITHUB_REPOSITORY"
